<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Barzinho">
<meta name="theme-color" content="#14110f">
<title>Barzinho · Sistema</title>
<style>
  :root {
    --bg: #14110f; --painel: #201a17; --painel2: #2a231f; --linha: #3a312b;
    --txt: #f4ede5; --sub: #b9ab9c; --ambar: #e9a23b; --verde: #3fb37f;
    --azul: #4a90d9; --verm: #e05a4f; --laranja: #f08a3c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; }
  body { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; border-radius: 10px; }
  button:disabled { opacity: .45; cursor: default; }
  input { font: inherit; }
  .hidden { display: none !important; }

  /* topo */
  header { display: flex; align-items: center; padding: 8px 14px; background: #0d0b0a; border-bottom: 1px solid var(--linha); min-height: 54px; }
  header > * { margin-right: 12px; }
  .marca { font-weight: 800; letter-spacing: .5px; color: var(--ambar); font-size: 19px; }
  #tela-nome { font-weight: 700; font-size: 17px; }
  .espaco { flex: 1; }
  #conexao { font-size: 13px; color: var(--verde); white-space: nowrap; }
  #conexao.off { color: var(--verm); }
  #relogio { font-variant-numeric: tabular-nums; color: var(--sub); font-size: 17px; }
  .ghost { background: var(--painel2); padding: 9px 14px; font-size: 14px; margin-right: 0; }
  #demo { background: #5b3b0c; color: #ffd99a; font-size: 13px; padding: 6px 14px; text-align: center; }

  main { flex: 1; overflow: hidden; position: relative; }

  /* tela inicial */
  .inicio { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .inicio h1 { margin: 0 0 6px; color: var(--ambar); }
  .inicio p { color: var(--sub); margin: 0 0 26px; }
  .telas { display: grid; grid-template-columns: repeat(3, 210px); grid-gap: 18px; }
  .tela-btn { background: var(--painel); border: 2px solid var(--linha); padding: 30px 10px; font-size: 22px; font-weight: 700; }
  .tela-btn span { display: block; font-size: 46px; margin-bottom: 8px; }
  .tela-btn small { display: block; font-size: 13px; font-weight: 400; color: var(--sub); margin-top: 6px; }

  .comecar { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10,8,7,.92); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .comecar button { background: var(--ambar); color: #1b1206; font-size: 24px; font-weight: 800; padding: 26px 40px; border-radius: 16px; }
  .comecar small { display: block; font-size: 14px; font-weight: 500; margin-top: 6px; }

  /* caixa */
  .caixa { display: grid; grid-template-columns: 330px 1fr; height: 100%; }
  .lado { border-right: 1px solid var(--linha); overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; }
  .mesas { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; }
  .mesa { background: var(--painel); border: 2px solid var(--linha); padding: 12px 10px; text-align: left; min-height: 92px; position: relative; }
  .mesa.ocupada { background: #2b2118; border-color: #6b4a22; }
  .mesa.sel { border-color: var(--ambar); box-shadow: 0 0 0 2px var(--ambar) inset; }
  .mesa.balcao { grid-column: span 2; min-height: 70px; }
  .mesa-nome { display: block; font-weight: 800; font-size: 19px; }
  .mesa-info { display: block; color: var(--sub); margin-top: 2px; font-size: 15px; }
  .mesa.ocupada .mesa-info { color: var(--ambar); font-weight: 700; }
  .badges { display: block; margin-top: 6px; }
  .b { font-style: normal; font-size: 12px; padding: 2px 7px; border-radius: 20px; margin-right: 4px; display: inline-block; margin-top: 2px; }
  .b.prep { background: #24384f; color: #a9cdf5; }
  .b.pronto { background: var(--verde); color: #08210f; font-weight: 700; -webkit-animation: pulso 1.2s infinite; animation: pulso 1.2s infinite; }
  @-webkit-keyframes pulso { 50% { opacity: .55; } }
  @keyframes pulso { 50% { opacity: .55; } }

  .lado h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--sub); margin: 18px 0 8px; }
  .pronto-linha { display: flex; align-items: center; background: #183324; border: 1px solid #2b6a46; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .pronto-linha div { flex: 1; font-size: 15px; }
  .pronto-linha b { color: #8be0b4; }
  .pronto-linha button { background: var(--verde); color: #08210f; font-weight: 700; padding: 9px 12px; font-size: 14px; }
  .nada { color: var(--sub); font-size: 14px; padding: 4px 2px; }
  .dia-box { background: var(--painel); border-radius: 12px; padding: 12px; margin-top: 8px; }
  .dia-box .lin { display: flex; justify-content: space-between; font-size: 15px; padding: 2px 0; color: var(--sub); }
  .dia-box .lin.tot { color: var(--txt); font-weight: 800; font-size: 18px; border-top: 1px solid var(--linha); margin-top: 6px; padding-top: 8px; }
  .dia-box button { width: 100%; margin-top: 10px; background: var(--painel2); border: 1px solid var(--linha); padding: 12px; font-weight: 700; }

  .comanda { display: flex; flex-direction: column; overflow: hidden; }
  .cmd-topo { padding: 14px 18px; border-bottom: 1px solid var(--linha); display: flex; align-items: center; }
  .cmd-topo h2 { margin: 0; font-size: 26px; flex: 1; }
  .cmd-topo .tot { font-size: 26px; font-weight: 800; color: var(--ambar); }
  .cmd-lista { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 18px; }
  .item { display: flex; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--linha); }
  .item .q { width: 44px; font-weight: 800; font-size: 18px; }
  .item .p { flex: 1; font-size: 17px; }
  .item .p small { display: block; color: var(--sub); font-size: 13px; margin-top: 2px; }
  .item .p .obs { color: var(--ambar); }
  .item .v { width: 92px; text-align: right; margin-right: 10px; font-variant-numeric: tabular-nums; }
  .item.st-cancelado { opacity: .4; }
  .item.st-cancelado .p { text-decoration: line-through; }
  .chip { font-size: 12px; padding: 4px 9px; border-radius: 20px; white-space: nowrap; margin-right: 8px; font-weight: 700; }
  .chip.novo { background: #4a3a14; color: #ffd27a; }
  .chip.preparando { background: #24384f; color: #a9cdf5; }
  .chip.pronto { background: var(--verde); color: #08210f; }
  .chip.entregue { background: #33302d; color: #a99e93; }
  .chip.cancelado { background: #4a1d1a; color: #f0a39c; }
  .mini { padding: 8px 11px; font-size: 13px; background: var(--painel2); border: 1px solid var(--linha); margin-left: 4px; }
  .mini.ok { background: var(--verde); color: #08210f; border: 0; font-weight: 700; }
  .mini.x { color: #f0a39c; }
  .cmd-acoes { padding: 12px 18px; border-top: 1px solid var(--linha); display: grid; grid-template-columns: 2fr 1.3fr 1.3fr; grid-gap: 10px; }
  .pri { background: var(--ambar); color: #1b1206; font-weight: 800; padding: 16px; font-size: 18px; }
  .sec { background: var(--painel2); border: 1px solid var(--linha); padding: 16px; font-weight: 700; }
  .ok-btn { background: var(--verde); color: #08210f; font-weight: 800; padding: 16px; }
  .vazio { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 20px; text-align: center; padding: 20px; }

  /* modal */
  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.7); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-box { background: var(--painel); border: 1px solid var(--linha); border-radius: 16px; width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; }
  .modal-box.grande { max-width: 1100px; height: 100%; padding: 0; overflow: hidden; }
  .modal-box h2 { margin: 0 0 14px; }
  .modal-rod { display: grid; grid-template-columns: 1fr 1.6fr; grid-gap: 10px; margin-top: 16px; }

  /* seletor de produtos */
  .picker { display: grid; grid-template-columns: 1fr 380px; height: 100%; }
  .pk-esq { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--linha); }
  .pk-topo { padding: 14px; border-bottom: 1px solid var(--linha); }
  .pk-topo input { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--linha); background: var(--bg); color: var(--txt); font-size: 17px; }
  .filtros { margin-top: 10px; }
  .filtros button { padding: 9px 16px; background: var(--painel2); margin-right: 6px; font-weight: 700; font-size: 15px; }
  .filtros button.on { background: var(--ambar); color: #1b1206; }
  .prods { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-gap: 10px; align-content: start; }
  .prod { background: var(--painel2); border: 1px solid var(--linha); padding: 12px 10px; text-align: left; min-height: 86px; position: relative; }
  .prod b { display: block; font-size: 16px; line-height: 1.2; }
  .prod .pr { display: block; color: var(--ambar); margin-top: 6px; font-weight: 700; }
  .prod .est { display: block; font-size: 12px; color: var(--sub); margin-top: 3px; }
  .prod .est.baixo { color: var(--laranja); font-weight: 700; }
  .prod .tag { position: absolute; top: 8px; right: 8px; font-size: 14px; }
  .prod.qtd { border-color: var(--ambar); }
  .prod .n { position: absolute; bottom: 8px; right: 8px; background: var(--ambar); color: #1b1206; border-radius: 20px; font-weight: 800; font-size: 13px; padding: 1px 8px; }
  .pk-dir { display: flex; flex-direction: column; overflow: hidden; }
  .pk-dir h3 { margin: 0; padding: 16px; border-bottom: 1px solid var(--linha); font-size: 20px; }
  .carrinho { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 14px; }
  .cr { padding: 10px 0; border-bottom: 1px solid var(--linha); }
  .cr-l { display: flex; align-items: center; }
  .cr-l .nm { flex: 1; font-weight: 700; }
  .cr-l .nm small { display: block; font-weight: 400; color: var(--sub); font-size: 12px; }
  .qbtn { width: 38px; height: 38px; background: var(--painel2); border: 1px solid var(--linha); font-size: 20px; font-weight: 800; padding: 0; }
  .cr-l .qv { width: 34px; text-align: center; font-weight: 800; font-size: 18px; }
  .cr input { width: 100%; margin-top: 7px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--linha); background: var(--bg); color: var(--txt); font-size: 14px; }
  .pk-rod { border-top: 1px solid var(--linha); padding: 14px; }
  .pk-rod .tt { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; margin-bottom: 10px; }
  .pk-rod .bt { display: grid; grid-template-columns: 1fr 2fr; grid-gap: 10px; }

  /* fechar conta */
  .fc-lista .lin, .resumo .lin { display: flex; justify-content: space-between; padding: 5px 0; font-size: 16px; }
  .fc-lista { max-height: 210px; overflow-y: auto; -webkit-overflow-scrolling: touch; border-bottom: 1px solid var(--linha); margin-bottom: 8px; padding-bottom: 6px; }
  .resumo .lin.sub { color: var(--sub); }
  .resumo .lin.tot { font-size: 24px; font-weight: 800; color: var(--ambar); border-top: 1px solid var(--linha); margin-top: 6px; padding-top: 10px; }
  .opcao { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
  .toggle { background: var(--painel2); border: 1px solid var(--linha); padding: 9px 14px; font-weight: 700; }
  .toggle.on { background: var(--ambar); color: #1b1206; border-color: var(--ambar); }
  .pags { display: grid; grid-template-columns: repeat(4, 1fr); grid-gap: 8px; margin-top: 6px; }
  .pags button { background: var(--painel2); border: 1px solid var(--linha); padding: 14px 4px; font-weight: 700; }
  .pags button.on { background: var(--ambar); color: #1b1206; }
  .aviso { background: #4a3a14; color: #ffd27a; padding: 9px 12px; border-radius: 10px; font-size: 14px; margin: 10px 0 0; }
  .div { display: flex; align-items: center; }
  .div .qv { width: 40px; text-align: center; font-weight: 800; }

  /* bar / cozinha */
  .kds { display: grid; grid-template-columns: 1fr 1fr 0.75fr; height: 100%; }
  .col { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--linha); }
  .col:last-child { border-right: 0; }
  .col-h { padding: 12px 14px; font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--linha); }
  .col-h .n { background: var(--painel2); padding: 2px 10px; border-radius: 20px; margin-left: 6px; }
  .col-novo .col-h { color: #ffd27a; }
  .col-prep .col-h { color: #a9cdf5; }
  .col-pronto .col-h { color: #8be0b4; }
  .col-b { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; }
  .card { background: var(--painel); border: 2px solid var(--linha); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .card.novo { border-color: #8a6a1f; }
  .card.atencao { border-color: var(--laranja); }
  .card.atrasado { border-color: var(--verm); }
  .card.chegou { -webkit-animation: chegou 1s 4; animation: chegou 1s 4; }
  @-webkit-keyframes chegou { 50% { background: #5b4512; } }
  @keyframes chegou { 50% { background: #5b4512; } }
  .card-h { display: flex; align-items: baseline; padding: 10px 14px; background: rgba(255,255,255,.04); }
  .card-h .m { font-size: 24px; font-weight: 800; flex: 1; }
  .card-h .t { color: var(--sub); font-size: 15px; }
  .card.atencao .card-h .t { color: var(--laranja); font-weight: 700; }
  .card.atrasado .card-h .t { color: var(--verm); font-weight: 800; }
  .card-i { padding: 6px 14px; }
  .ci { padding: 6px 0; font-size: 21px; font-weight: 600; }
  .ci b { color: var(--ambar); margin-right: 6px; }
  .ci .obs { display: block; font-size: 16px; color: #ffcf7a; background: #3d2e10; border-radius: 6px; padding: 3px 8px; margin-top: 3px; font-weight: 600; }
  .card-a { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 8px; padding: 10px 14px 14px; }
  .card-a.um { grid-template-columns: 1fr; }
  .card-a button { padding: 15px 6px; font-weight: 800; font-size: 17px; }
  .bt-prep { background: var(--azul); color: #fff; }
  .bt-pronto { background: var(--verde); color: #08210f; }
  .bt-voltar { background: var(--painel2); border: 1px solid var(--linha); font-size: 14px !important; padding: 10px !important; }
  .card.pronto { opacity: .8; }
  .card.pronto .ci { font-size: 17px; }

  .toast { position: fixed; left: 50%; bottom: 24px; -webkit-transform: translateX(-50%); transform: translateX(-50%); background: #2e2722; border: 1px solid var(--linha); padding: 14px 20px; border-radius: 12px; z-index: 80; font-size: 16px; max-width: 90%; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .toast.erro { background: #5a1f1a; border-color: var(--verm); }
  .toast.bom { background: #183324; border-color: var(--verde); }

  @media (max-width: 820px) {
    .caixa { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; }
    .lado { border-right: 0; border-bottom: 1px solid var(--linha); overflow: visible; }
    .mesas { grid-template-columns: repeat(4, 1fr); }
    .mesa.balcao { grid-column: span 1; }
    .picker { grid-template-columns: 1fr; grid-template-rows: 1fr 300px; }
    .kds { grid-template-columns: 1fr 1fr; }
    .col-pronto { display: none; }
    .telas { grid-template-columns: 1fr; }
    #relogio { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="marca">BARZINHO</div>
  <div id="tela-nome"></div>
  <div class="espaco"></div>
  <div id="conexao"></div>
  <div id="relogio"></div>
  <button class="ghost hidden" id="btn-trocar" data-acao="trocar">Trocar tela</button>
</header>
<div id="demo" class="hidden">MODO DEMONSTRAÇÃO: os dados ficam só neste aparelho. Cole a URL do Apps Script em SCRIPT_URL para ligar os tablets à planilha.</div>
<main id="app"></main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
'use strict';
/* =====================================================================
   CONFIGURAÇÃO — cole aqui a URL do App da Web do Apps Script (termina em /exec)
   ===================================================================== */
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwfK1IuJGEUm9mHp_AOaZGL0lK0UjpbVaj94G4n-02CETyS2u_Mu6twqKEY02G97_LP/exec';
var MESAS = ['1', '2', '3', '4', '5', '6', 'Balcão'];
var PAGAMENTOS = ['Pix', 'Débito', 'Crédito', 'Dinheiro'];
var INTERVALO = 4000;        // atualização automática (ms)
var ESTOQUE_BAIXO = 5;       // destaca produtos com estoque baixo
/* ===================================================================== */

var TELAS = { caixa: 'Caixa', bar: 'Bar', cozinha: 'Cozinha' };
var STATUS_TXT = { novo: 'Enviado', preparando: 'Em preparo', pronto: 'Pronto', entregue: 'Entregue', cancelado: 'Cancelado' };

var S = {
  tela: null, produtos: [], itens: [], dia: null, offset: 0,
  mesaSel: null, carrinho: [], filtro: 'TODOS', busca: '',
  assinatura: '', vistos: {}, primeira: true, recem: {},
  timer: null, pendentes: 0, seq: 0, fech: null, iniciado: false
};

/* ---------------------------------------------------------------- utilidades */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function brl(v) {
  var n = Math.round((Number(v) || 0) * 100) / 100;
  var p = n.toFixed(2).split('.');
  return 'R$ ' + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + p[1];
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
function mesaNome(m) { return m === 'Balcão' ? 'Balcão' : 'Mesa ' + m; }
function agora() { return Date.now() + S.offset; }
function minutos(ms) { return Math.max(0, Math.floor((agora() - ms) / 60000)); }
function hhmm(ms) { var d = new Date(ms); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function sem(s) { return String(s).toLowerCase().normalize ? String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '') : String(s).toLowerCase(); }
function ativos(lista) { return lista.filter(function (i) { return i.status !== 'cancelado'; }); }
function soma(lista) { return lista.reduce(function (t, i) { return t + i.qnt * i.preco; }, 0); }
function itensMesa(m) { return S.itens.filter(function (i) { return i.mesa === m && !i.pago; }); }
function produto(nome) { for (var i = 0; i < S.produtos.length; i++) if (S.produtos[i].nome === nome) return S.produtos[i]; return null; }

var tToast;
function toast(msg, tipo, tempo) {
  var t = $('toast');
  t.className = 'toast ' + (tipo || '');
  t.textContent = msg;
  clearTimeout(tToast);
  tToast = setTimeout(function () { t.className = 'toast hidden'; }, tempo || 3200);
}

/* ---------------------------------------------------------------- som */
var AC = null;
function liberarSom() {
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    if (!AC) AC = new C();
    if (AC.state === 'suspended' && AC.resume) AC.resume();
    var b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource();
    s.buffer = b; s.connect(AC.destination); s.start(0);
  } catch (e) { }
}
function bip(vezes, freq) {
  if (!AC) return;
  try {
    for (var i = 0; i < vezes; i++) {
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * 0.28;
      o.type = 'sine'; o.frequency.value = freq || 880;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + 0.26);
    }
  } catch (e) { }
}

/* ---------------------------------------------------------------- comunicação */
function api(acao, dados) {
  dados = dados || {};
  dados.acao = acao;
  dados.senha = lsGet('lc_senha') || '';
  var p;
  if (!SCRIPT_URL) {
    p = new Promise(function (ok) { setTimeout(function () { ok(Demo.tratar(JSON.parse(JSON.stringify(dados)))); }, 150); });
  } else {
    p = Promise.race([
      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(dados) }).then(function (r) { return r.json(); }),
      new Promise(function (_, falha) { setTimeout(function () { falha(new Error('Servidor demorou para responder')); }, 20000); })
    ]);
  }
  return p.then(function (res) {
    if (!res || !res.ok) {
      var msg = (res && res.erro) || 'Erro desconhecido';
      if (msg === 'Senha inválida') pedirSenha();
      throw new Error(msg);
    }
    return res;
  });
}

function aplicar(res) {
  if (res.agora) S.offset = res.agora - Date.now();
  S.produtos = res.produtos || [];
  S.itens = res.itens || [];
  S.dia = res.dia || null;
  var a = JSON.stringify([S.itens, S.dia, S.produtos]);
  detectarNovos();
  if (a !== S.assinatura) { S.assinatura = a; desenhar(); }
}

function carregar() {
  var seq = S.seq;
  return api('estado').then(function (res) {
    conexao(true);
    if (S.pendentes > 0 || seq !== S.seq) return;   // resposta antiga: ignora
    aplicar(res);
  }).catch(function (e) {
    conexao(false, e.message);
  });
}

function ciclo() {
  clearTimeout(S.timer);
  S.timer = setTimeout(function () {
    if (document.hidden || $('senha-in')) { ciclo(); return; }
    carregar().then(ciclo);
  }, INTERVALO);
}

/* executa uma ação: atualiza a tela na hora e confirma com o servidor */
function executar(acao, dados, otimista, botao) {
  S.pendentes++; S.seq++;
  if (botao) botao.disabled = true;
  if (otimista) { otimista(); S.assinatura = ''; desenhar(); }
  return api(acao, dados).then(function (res) {
    S.pendentes--; S.seq++;
    conexao(true);
    S.assinatura = '';
    aplicar(res);
    return res;
  }).catch(function (e) {
    S.pendentes--; S.seq++;
    toast('Não foi possível: ' + e.message, 'erro', 5000);
    carregar();
    throw e;
  }).then(function (r) { if (botao) botao.disabled = false; return r; }, function (e) { if (botao) botao.disabled = false; throw e; });
}

function conexao(ok, msg) {
  var c = $('conexao');
  c.className = ok ? '' : 'off';
  c.textContent = ok ? '● conectado' : '● sem conexão';
  c.title = msg || '';
}

function detectarNovos() {
  var novosSetor = 0, prontos = 0;
  var setor = S.tela === 'bar' ? 'BAR' : S.tela === 'cozinha' ? 'COZINHA' : null;
  S.itens.forEach(function (it) {
    var k = it.id + ':' + it.status;
    if (S.vistos[k]) return;
    S.vistos[k] = 1;
    if (S.primeira) return;
    if (setor && it.setor === setor && it.status === 'novo') { novosSetor++; S.recem[it.pedido] = Date.now(); }
    if (S.tela === 'caixa' && it.status === 'pronto') prontos++;
  });
  S.primeira = false;
  if (novosSetor) { bip(3, 988); toast('Novo pedido chegou!', 'bom'); }
  if (prontos) { bip(2, 660); toast(prontos + (prontos > 1 ? ' itens prontos' : ' item pronto') + ' para entregar', 'bom'); }
}

function noCarrinho(nome) {
  return S.carrinho.reduce(function (t, c) { return t + (c.nome === nome ? c.qnt : 0); }, 0);
}

function desenharProdutos() {
  if (!$('prods')) return;
  var b = sem(S.busca.trim());
  var lista = S.produtos.filter(function (p) {
    return (S.filtro === 'TODOS' || p.setor === S.filtro) && (!b || sem(p.nome).indexOf(b) >= 0);
  });
  $('prods').innerHTML = lista.length ? lista.map(function (p) {
    var n = noCarrinho(p.nome);
    var resta = p.qnt == null ? null : p.qnt - n;
    var est = resta == null ? '' : resta <= 0 ? '<span class="est baixo">Esgotado</span>' :
      '<span class="est' + (resta <= ESTOQUE_BAIXO ? ' baixo' : '') + '">' + resta + ' em estoque</span>';
    return '<button class="prod' + (n ? ' qtd' : '') + '" data-acao="add" data-nome="' + esc(p.nome) + '"' + (resta != null && resta <= 0 ? ' disabled' : '') + '>' +
      '<span class="tag">' + (p.setor === 'COZINHA' ? '🍳' : '🍸') + '</span><b>' + esc(p.nome) + '</b>' +
      '<span class="pr">' + (p.preco ? brl(p.preco) : 'sem preço') + '</span>' + est + (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }).join('') : '<div class="nada">Nenhum produto encontrado.</div>';
}

function desenharCarrinho() {
  var c = $('carrinho');
  if (!c) return;
  c.innerHTML = S.carrinho.length ? S.carrinho.map(function (it, i) {
    return '<div class="cr"><div class="cr-l"><div class="nm">' + esc(it.nome) + '<small>' + brl(it.preco) + ' · ' + (it.setor === 'COZINHA' ? 'vai para a cozinha' : 'vai para o bar') + '</small></div>' +
      '<button class="qbtn" data-acao="menos" data-i="' + i + '">−</button><span class="qv">' + it.qnt + '</span>' +
      '<button class="qbtn" data-acao="mais" data-i="' + i + '">+</button></div>' +
      '<input data-obs="' + i + '" placeholder="Observação (ex.: sem cebola)" value="' + esc(it.obs) + '"></div>';
  }).join('') : '<div class="nada" style="padding:20px 4px">Toque nos produtos para adicionar.</div>';
  $('carr-total').textContent = brl(S.carrinho.reduce(function (t, i) { return t + i.qnt * i.preco; }, 0));
  $('btn-enviar').disabled = !S.carrinho.length;
}

function adicionar(nome, delta, idx) {
  var p = produto(nome);
  if (idx == null) {
    for (var i = S.carrinho.length - 1; i >= 0; i--) if (S.carrinho[i].nome === nome && !S.carrinho[i].obs) { idx = i; break; }
  }
  if (delta > 0 && p && p.qnt != null && noCarrinho(nome) >= p.qnt) { toast('Estoque de ' + nome + ' acabou', 'erro'); return; }
  if (idx == null) S.carrinho.push({ nome: nome, qnt: 1, obs: '', preco: p ? p.preco : 0, setor: p ? p.setor : 'BAR' });
  else {
    S.carrinho[idx].qnt += delta;
    if (S.carrinho[idx].qnt <= 0) S.carrinho.splice(idx, 1);
  }
  desenharProdutos(); desenharCarrinho();
}

function enviarPedido(botao) {
  if (!S.carrinho.length) return;
  var mesa = S.mesaSel, itens = S.carrinho.map(function (c) { return { produto: c.nome, qnt: c.qnt, obs: c.obs }; });
  var nb = 0, nc = 0;
  S.carrinho.forEach(function (c) { if (c.setor === 'COZINHA') nc += c.qnt; else nb += c.qnt; });
  botao.disabled = true; botao.textContent = 'Enviando…';
  executar('pedido', { mesa: mesa, itens: itens }).then(function () {
    fecharModal();
    toast('Pedido enviado' + (nb ? ' · ' + nb + ' p/ bar' : '') + (nc ? ' · ' + nc + ' p/ cozinha' : ''), 'bom');
  }).catch(function () { botao.disabled = false; botao.textContent = 'Enviar pedido'; });
}

/* ---------- entregar / cancelar */
function marcar(ids, status, botao) {
  if (!ids.length) return;
  executar('status', { ids: ids, status: status }, function () {
    S.itens.forEach(function (i) { if (ids.indexOf(i.id) >= 0) { i.status = status; i.atualizado = agora(); } });
    S.vistos = S.vistos || {};
    ids.forEach(function (id) { S.vistos[id + ':' + status] = 1; });
  }, botao).catch(function () { });
}

function confirmarCancelar(id) {
  var it = null;
  S.itens.forEach(function (i) { if (i.id === id) it = i; });
  if (!it) return;
  abrirModal('<h2>Cancelar item?</h2><p>' + it.qnt + 'x <b>' + esc(it.produto) + '</b> da ' + esc(mesaNome(it.mesa)) + '.</p>' +
    '<p style="color:var(--sub)">O item sai da tela do ' + (it.setor === 'COZINHA' ? 'cozinha' : 'bar') + ' e o estoque volta.</p>' +
    '<div class="modal-rod"><button class="sec" data-acao="fechar-modal">Voltar</button>' +
    '<button class="pri" style="background:var(--verm);color:#fff" data-acao="cancelar-ok" data-id="' + esc(id) + '">Cancelar item</button></div>');
}

/* ---------- fechar conta */
function abrirFechar() {
  var m = S.mesaSel, its = ativos(itensMesa(m));
  if (!its.length) return;
  S.fech = { servico: false, pagamento: null, pessoas: 1 };
  var agg = {}, ordem = [];
  its.forEach(function (i) {
    var k = i.produto + '|' + i.preco;
    if (!agg[k]) { agg[k] = { nome: i.produto, qnt: 0, preco: i.preco }; ordem.push(k); }
    agg[k].qnt += i.qnt;
  });
  var pend = its.filter(function (i) { return i.status !== 'entregue'; }).length;
  abrirModal('<h2>Fechar conta · ' + esc(mesaNome(m)) + '</h2>' +
    '<div class="fc-lista">' + ordem.map(function (k) {
      var a = agg[k];
      return '<div class="lin"><span>' + a.qnt + 'x ' + esc(a.nome) + '</span><span>' + brl(a.qnt * a.preco) + '</span></div>';
    }).join('') + '</div>' +
    '<div class="opcao"><span>Taxa de serviço (10%)</span><button class="toggle" id="fc-serv" data-acao="fc-serv">Não</button></div>' +
    '<div class="opcao"><span>Dividir entre</span><span class="div"><button class="qbtn" data-acao="fc-pes" data-d="-1">−</button><span class="qv" id="fc-pes">1</span><button class="qbtn" data-acao="fc-pes" data-d="1">+</button></span></div>' +
    '<div class="resumo" id="fc-resumo"></div>' +
    '<div style="margin-top:12px;color:var(--sub)">Forma de pagamento</div>' +
    '<div class="pags" id="fc-pags">' + PAGAMENTOS.map(function (p) { return '<button data-acao="fc-pag" data-p="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') + '</div>' +
    (pend ? '<div class="aviso">⚠ ' + pend + ' item(ns) ainda não foram entregues. Eles continuam na tela do bar/cozinha e em “Prontos para entregar”.</div>' : '') +
    '<div class="modal-rod"><button class="sec" data-acao="fechar-modal">Voltar</button>' +
    '<button class="ok-btn" id="fc-ok" data-acao="fc-confirmar" disabled>Confirmar pagamento</button></div>');
  desenharFechar();
}

  var its = ativos(itensMesa(S.mesaSel));
  var beb = soma(its.filter(function (i) { return i.setor !== 'COZINHA'; }));
  var com = soma(its.filter(function (i) { return i.setor === 'COZINHA'; }));
  var sub = beb + com, serv = S.fech.servico ? Math.round(sub * 10) / 100 : 0, tot = sub + serv;
  $('fc-serv').className = 'toggle' + (S.fech.servico ? ' on' : '');
  $('fc-serv').textContent = S.fech.servico ? 'Sim' : 'Não';
  $('fc-pes').textContent = S.fech.pessoas;
  $('fc-resumo').innerHTML =
    '<div class="lin sub"><span>Bebidas</span><span>' + brl(beb) + '</span></div>' +
    '<div class="lin sub"><span>Comidas</span><span>' + brl(com) + '</span></div>' +
    (serv ? '<div class="lin sub"><span>Serviço 10%</span><span>' + brl(serv) + '</span></div>' : '') +
    '<div class="lin tot"><span>Total</span><span>' + brl(tot) + '</span></div>' +
    (S.fech.pessoas > 1 ? '<div class="lin"><span>Por pessoa (' + S.fech.pessoas + ')</span><span>' + brl(tot / S.fech.pessoas) + '</span></div>' : '');
  var bs = $('fc-pags').querySelectorAll('button');
  for (var i = 0; i < bs.length; i++) bs[i].className = bs[i].getAttribute('data-p') === S.fech.pagamento ? 'on' : '';
  $('fc-ok').disabled = !S.fech.pagamento;
}

function confirmarFechar(botao) {
  var mesa = S.mesaSel;
  botao.textContent = 'Fechando…';
  executar('fechar', { mesa: mesa, pagamento: S.fech.pagamento, servico: S.fech.servico }, null, botao).then(function (res) {

function resumoHtml(d) {
  var pg = d.pagamentos || {};
  return '<div class="lin sub"><span>Contas fechadas</span><span>' + d.contas + '</span></div>' +
    '<div class="lin sub"><span>Bebidas</span><span>' + brl(d.bebidas) + '</span></div>' +
    '<div class="lin sub"><span>Comidas</span><span>' + brl(d.comidas) + '</span></div>' +
    '<div class="lin sub"><span>Serviço</span><span>' + brl(d.servico) + '</span></div>' +
    Object.keys(pg).map(function (k) { return '<div class="lin sub"><span>· ' + esc(k) + '</span><span>' + brl(pg[k]) + '</span></div>'; }).join('') +
    '<div class="lin tot"><span>Total do dia</span><span>' + brl(d.total) + '</span></div>';
}

function confirmarFimDia(botao) {
  botao.textContent = 'Encerrando…';
  executar('fimDoDia', {}, null, botao).then(function (res) {
    abrirModal('<h2>Dia encerrado ✓</h2><div class="resumo">' + resumoHtml(res.fim || {}) + '</div>' +
      '<div class="modal-rod" style="grid-template-columns:1fr"><button class="pri" data-acao="fechar-modal">OK</button></div>');
  }).catch(function () { botao.textContent = 'Encerrar o dia'; });
}

/* ================================================================ BAR / COZINHA */
function montarKDS() {
  $('app').innerHTML = '<div class="kds">' +
    '<div class="col col-novo"><div class="col-h">Novos<span class="n" id="n-novo">0</span></div><div class="col-b" id="k-novo"></div></div>' +
    '<div class="col col-prep"><div class="col-h">Em preparo<span class="n" id="n-prep">0</span></div><div class="col-b" id="k-prep"></div></div>' +
    '<div class="col col-pronto"><div class="col-h">Prontos<span class="n" id="n-pronto">0</span></div><div class="col-b" id="k-pronto"></div></div></div>';
  desenharKDS();
}

function grupos(lista) {
  var g = {}, ordem = [];
  lista.forEach(function (i) {
    if (!g[i.pedido]) { g[i.pedido] = { pedido: i.pedido, mesa: i.mesa, hora: i.hora, atualizado: 0, itens: [] }; ordem.push(i.pedido); }
    g[i.pedido].itens.push(i);
    g[i.pedido].atualizado = Math.max(g[i.pedido].atualizado, i.atualizado);
  });
  return ordem.map(function (k) { return g[k]; });
}

function cardHtml(g, fase) {
  var min = minutos(g.hora);
  var cls = 'card ' + fase;
  if (fase !== 'pronto') cls += min >= 20 ? ' atrasado' : min >= 10 ? ' atencao' : '';
  if (fase === 'novo' && S.recem[g.pedido] && Date.now() - S.recem[g.pedido] < 6000) cls += ' chegou';
  var ids = g.itens.map(function (i) { return i.id; }).join(',');
  var bts = fase === 'novo'
    ? '<div class="card-a"><button class="bt-prep" data-acao="k-status" data-st="preparando" data-ids="' + ids + '">Preparar</button>' +
      '<button class="bt-pronto" data-acao="k-status" data-st="pronto" data-ids="' + ids + '">Pronto ✓</button></div>'
    : fase === 'preparando'
      ? '<div class="card-a um"><button class="bt-pronto" data-acao="k-status" data-st="pronto" data-ids="' + ids + '">Pronto ✓</button></div>'
      : '<div class="card-a um"><button class="bt-voltar" data-acao="k-status" data-st="preparando" data-ids="' + ids + '">↩ Voltar para preparo</button></div>';
  return '<div class="' + cls + '"><div class="card-h"><span class="m">' + esc(mesaNome(g.mesa)) + '</span>' +
    '<span class="t">' + hhmm(g.hora) + (fase !== 'pronto' ? ' · ' + (min < 1 ? 'agora' : 'há ' + min + ' min') : '') + '</span></div>' +
    '<div class="card-i">' + g.itens.map(function (i) {
      return '<div class="ci"><b>' + i.qnt + 'x</b>' + esc(i.produto) + (i.obs ? '<span class="obs">⚠ ' + esc(i.obs) + '</span>' : '') + '</div>';
    }).join('') + '</div>' + bts + '</div>';
}

function desenharKDS() {
  if (!$('k-novo')) return;
  var setor = S.tela === 'bar' ? 'BAR' : 'COZINHA';
  var meus = S.itens.filter(function (i) { return i.setor === setor; });
  function fase(st) { return meus.filter(function (i) { return i.status === st; }).sort(function (a, b) { return a.hora - b.hora; }); }
  var gN = grupos(fase('novo')), gP = grupos(fase('preparando'));
  var gR = grupos(fase('pronto')).sort(function (a, b) { return b.atualizado - a.atualizado; }).slice(0, 12);
  $('n-novo').textContent = gN.length; $('n-prep').textContent = gP.length; $('n-pronto').textContent = gR.length;
  $('k-novo').innerHTML = gN.map(function (g) { return cardHtml(g, 'novo'); }).join('') || '<div class="nada">Sem pedidos novos.</div>';
  $('k-prep').innerHTML = gP.map(function (g) { return cardHtml(g, 'preparando'); }).join('') || '<div class="nada">Nada em preparo.</div>';
  $('k-pronto').innerHTML = gR.map(function (g) { return cardHtml(g, 'pronto'); }).join('') || '<div class="nada">Itens prontos aparecem aqui até o caixa entregar.</div>';
}

/* ================================================================ modal / senha */
function abrirModal(html, classe) {
  $('modal-box').className = 'modal-box' + (classe ? ' ' + classe : '');
  $('modal-box').innerHTML = html;
  $('modal').className = 'modal';
}
function fecharModal() { $('modal').className = 'modal hidden'; $('modal-box').innerHTML = ''; S.fech = null; }

function pedirSenha() {
  if ($('senha-in')) return;
  abrirModal('<h2>Senha do sistema</h2><p style="color:var(--sub)">Digite a senha definida no Apps Script. Ela fica salva neste aparelho.</p>' +
    '<div class="pk-topo" style="padding:0;border:0"><input id="senha-in" type="password" autocomplete="off"></div>' +
    '<div class="modal-rod" style="grid-template-columns:1fr"><button class="pri" data-acao="senha-ok">Entrar</button></div>');
}

/* ================================================================ eventos */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-acao]') : null;
  if (!el || el.disabled) return;
  var a = el.getAttribute('data-acao');
  var ids = (el.getAttribute('data-ids') || '').split(',').filter(Boolean);
  switch (a) {
    case 'tela': abrirTela(el.getAttribute('data-tela')); break;
    case 'trocar': fecharModal(); telaInicial(); break;
    case 'comecar': liberarSom(); S.iniciado = true; var c = $('comecar'); if (c) c.parentNode.removeChild(c); break;
    case 'mesa': S.mesaSel = el.getAttribute('data-mesa'); desenharMesas(); desenharComanda(); break;
    case 'novo-pedido': abrirPedido(); break;
    case 'filtro': S.filtro = el.getAttribute('data-f'); desenharFiltros(); desenharProdutos(); break;
    case 'add': adicionar(el.getAttribute('data-nome'), 1); break;
    case 'mais': adicionar(S.carrinho[+el.getAttribute('data-i')].nome, 1, +el.getAttribute('data-i')); break;
    case 'menos': adicionar(S.carrinho[+el.getAttribute('data-i')].nome, -1, +el.getAttribute('data-i')); break;
    case 'enviar': enviarPedido(el); break;
    case 'entregar': marcar(ids, 'entregue', el); break;
    case 'cancelar': confirmarCancelar(el.getAttribute('data-id')); break;
    case 'cancelar-ok':
      var cid = el.getAttribute('data-id');
      executar('cancelar', { ids: [cid] }, function () { S.itens.forEach(function (i) { if (i.id === cid) i.status = 'cancelado'; }); }, el)
        .then(function () { toast('Item cancelado'); }).catch(function () { });
      fecharModal();
      break;
    case 'fechar-conta': abrirFechar(); break;
    case 'fc-serv': S.fech.servico = !S.fech.servico; desenharFechar(); break;
    case 'fc-pes': S.fech.pessoas = Math.max(1, Math.min(30, S.fech.pessoas + (+el.getAttribute('data-d')))); desenharFechar(); break;
    case 'fc-pag': S.fech.pagamento = el.getAttribute('data-p'); desenharFechar(); break;
    case 'fc-confirmar': confirmarFechar(el); break;
    case 'fim-dia': abrirFimDia(); break;
    case 'fim-ok': confirmarFimDia(el); break;
    case 'k-status': marcar(ids, el.getAttribute('data-st'), el); break;
    case 'fechar-modal': fecharModal(); break;
    case 'senha-ok': lsSet('lc_senha', $('senha-in').value); fecharModal(); carregar(); break;
  }
});

document.addEventListener('input', function (ev) {
  var i = ev.target.getAttribute && ev.target.getAttribute('data-obs');
  if (i != null && S.carrinho[+i]) S.carrinho[+i].obs = ev.target.value;
});

$('modal').addEventListener('click', function (ev) {
  if (ev.target === $('modal') && !$('senha-in')) fecharModal();
});

document.addEventListener('visibilitychange', function () { if (!document.hidden && S.tela) carregar(); });

function relogio() {
  $('relogio').textContent = hhmm(Date.now());
  if (S.tela === 'bar' || S.tela === 'cozinha') desenharKDS();   // atualiza o "há X min"
}

/* ================================================================ modo demonstração
   Usado só quando SCRIPT_URL está vazio. Simula a planilha no próprio navegador
   (abas diferentes do mesmo navegador conversam entre si). */
var Demo = (function () {
  var CHAVE = 'lc_demo_v1', PEND = ['novo', 'preparando', 'pronto'];
  function semente() {
    var p = [
      ['Kariri', 100, 23, 'BAR'], ['Refrigerante', 100, 12, 'BAR'], ['Cerveja', 100, 18, 'BAR'],
      ['Conservas', 100, 12, 'COZINHA'], ['Lanche Costela', 100, 28, 'COZINHA'], ['Lanche Carne Louca', 100, 28, 'COZINHA'],
      ['Negroni'], ['Gim tônica'], ['Cynar Tônica'], ['Fernet Tônica'], ['Cantidia'], ['Aperol Spritz'],
      ['Kariri com mel'], ['Michelads'], ['Caipirinha'], ['Ferroviário']
    ];
    return {
      produtos: p.map(function (x) { return { nome: x[0], qnt: x[1] == null ? null : x[1], preco: x[2] || 0, setor: x[3] || 'BAR' }; }),
      itens: [], fech: []
    };
  }
  function ler() { try { var d = JSON.parse(localStorage.getItem(CHAVE)); if (d && d.produtos) return d; } catch (e) { } return semente(); }
  function gravar(d) { try { localStorage.setItem(CHAVE, JSON.stringify(d)); } catch (e) { } }
  function id() { return Math.random().toString(36).slice(2, 12); }
  function r2(v) { return Math.round(v * 100) / 100; }
  function resumo(d) {
    var r = { contas: 0, bebidas: 0, comidas: 0, servico: 0, total: 0, pagamentos: {} };
    d.fech.forEach(function (f) {
      if (f.fim) return;
      r.contas++; r.bebidas += f.bebidas; r.comidas += f.comidas; r.servico += f.servico; r.total += f.total;
      r.pagamentos[f.pagamento] = r2((r.pagamentos[f.pagamento] || 0) + f.total);
    });
    ['bebidas', 'comidas', 'servico', 'total'].forEach(function (k) { r[k] = r2(r[k]); });
    return r;
  }
  function estado(d) {
    return {
      ok: true, agora: Date.now(), dia: resumo(d),
      produtos: d.produtos.map(function (p) { return { nome: p.nome, qnt: p.qnt, preco: p.preco, setor: p.setor }; }),
      itens: d.itens.filter(function (i) { return !i.fech || PEND.indexOf(i.status) >= 0; }).map(function (i) {
        return { pago: !!i.fech, id: i.id, pedido: i.pedido, mesa: i.mesa, hora: i.hora, produto: i.produto, qnt: i.qnt, preco: i.preco, setor: i.setor, obs: i.obs, status: i.status, atualizado: i.atualizado };
      })
    };
  }
  function prod(d, nome) { for (var i = 0; i < d.produtos.length; i++) if (d.produtos[i].nome.toLowerCase() === String(nome).toLowerCase()) return d.produtos[i]; return null; }
  function tratar(p) {
    var d = ler(), extra = {};
    try {
      if (p.acao === 'pedido') {
        if (!p.itens || !p.itens.length) throw new Error('Pedido vazio');
        var precisa = {};
        p.itens.forEach(function (it) {
          var pr = prod(d, it.produto);
          if (!pr) throw new Error('Produto não encontrado: ' + it.produto);
          precisa[pr.nome] = (precisa[pr.nome] || 0) + it.qnt;
        });
        Object.keys(precisa).forEach(function (n) { var pr = prod(d, n); if (pr.qnt != null && pr.qnt < precisa[n]) throw new Error('Estoque insuficiente de ' + n + ' (restam ' + pr.qnt + ')'); });
        Object.keys(precisa).forEach(function (n) { var pr = prod(d, n); if (pr.qnt != null) pr.qnt -= precisa[n]; });
        var pid = id(), t = Date.now();
        p.itens.forEach(function (it) {
          var pr = prod(d, it.produto);
          d.itens.push({ id: id(), pedido: pid, mesa: String(p.mesa), hora: t, produto: pr.nome, qnt: it.qnt, preco: pr.preco, setor: pr.setor, obs: it.obs || '', status: 'novo', atualizado: t, fech: '' });
        });
      } else if (p.acao === 'status') {
        d.itens.forEach(function (i) { if (p.ids.indexOf(i.id) >= 0 && i.status !== 'cancelado' && (!i.fech || PEND.indexOf(i.status) >= 0)) { i.status = p.status; i.atualizado = Date.now(); } });
      } else if (p.acao === 'cancelar') {
        d.itens.forEach(function (i) {
          if (p.ids.indexOf(i.id) >= 0 && !i.fech && i.status !== 'cancelado') {
            i.status = 'cancelado'; i.atualizado = Date.now();
            var pr = prod(d, i.produto); if (pr && pr.qnt != null) pr.qnt += i.qnt;
          }
        });
      } else if (p.acao === 'fechar') {
        var its = d.itens.filter(function (i) { return !i.fech && i.mesa === String(p.mesa); });
        if (!its.length) throw new Error('Esta mesa não tem itens abertos');
        var beb = 0, com = 0;
        its.forEach(function (i) { if (i.status === 'cancelado') return; if (i.setor === 'COZINHA') com += i.qnt * i.preco; else beb += i.qnt * i.preco; });
        var sub = r2(beb + com), serv = p.servico ? r2(sub * 0.1) : 0;
        var f = { id: 'F' + Date.now(), mesa: String(p.mesa), bebidas: r2(beb), comidas: r2(com), servico: serv, total: r2(sub + serv), pagamento: p.pagamento || 'Não informado', fim: '' };
        d.fech.push(f);
        its.forEach(function (i) { i.fech = f.id; });
        extra.fechamento = f;
      } else if (p.acao === 'fimDoDia') {
        extra.fim = resumo(d);
        d.fech.forEach(function (f) { if (!f.fim) f.fim = Date.now(); });
        d.itens = d.itens.filter(function (i) { return !i.fech || PEND.indexOf(i.status) >= 0; });
      }
      gravar(d);
      var e = estado(d);
      for (var k in extra) e[k] = extra[k];
      return e;
    } catch (err) {
      return { ok: false, erro: err.message };
    }
  }
  return { tratar: tratar };
})();

/* ================================================================ início */
(function iniciar() {
  if (!SCRIPT_URL) $('demo').className = '';
  conexao(true);
  relogio();
  setInterval(relogio, 20000);
  var m = location.search.match(/tela=(caixa|bar|cozinha)/);
  var t = m ? m[1] : lsGet('lc_tela');
  if (t && TELAS[t]) abrirTela(t); else telaInicial();
})();
</script>
